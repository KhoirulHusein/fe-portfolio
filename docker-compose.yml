services:
  portfolio:
    image: ${APP_IMAGE:-ghcr.io/khoirulhusein/fe-portfolio}:latest
    # Caddyfile: reverse_proxy portfolio_app:3000
    container_name: ${APP_NAME:-portfolio}_app
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-3000}
      - HOSTNAME=0.0.0.0
      - API_BASE_URL=${API_BASE_URL:?API_BASE_URL belum di-set di .env}
    restart: unless-stopped
    mem_limit: 512m
    cpus: "0.5"
    networks:
      - edge
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${PORT:-3000}"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

# Dibuat oleh stack Caddy di /var/www/edge
networks:
  edge:
    external: true
    name: edge
