services:
  portfolio:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: ${APP_IMAGE:-portfolio}:latest
    container_name: ${APP_NAME:-portfolio}_app
    expose:
      - "${PORT:-3000}"
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-3000}
      - HOSTNAME=0.0.0.0
    restart: unless-stopped
    mem_limit: 512m
    cpus: "0.5"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${PORT:-3000}"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    container_name: ${APP_NAME:-portfolio}_nginx
    ports:
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./docker/error-pages:/etc/nginx/error-pages:ro
      - /etc/ssl/portfolio:/etc/ssl/portfolio:ro
    restart: unless-stopped
    networks:
      - internal
      - public
    depends_on:
      portfolio:
        condition: service_healthy

networks:
  internal:
    internal: true
  public:
